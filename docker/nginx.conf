server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 15m; # الترويسة حتى 5MB تُرسل base64 داخل JSON

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  # رفع نسخة احتياطية من الحاسوب (حتى 1GB) والاستعادة قد تستغرق دقائق
  location ^~ /api/v1/backups {
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_read_timeout 120s; # توليد تقارير PDF الطويلة
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ملاحظة: add_header داخل location يلغي ترويسات server، لذا تتكرر ترويسات الأمن في كل location أدناه.
  # PWA: ملف Service Worker والصفحة الرئيسية لا يُخزنان، ليصل التحديث فور نشره
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  # ملفات الحزم تحمل بصمة في اسمها فتُخزن طويلاً
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files $uri /index.html;
  }
}
